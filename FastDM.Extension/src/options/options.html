<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1 data-i18n="optionsTitle">FastDM settings</h1>

  <section class="card">
    <h2 data-i18n="optionsConnection">Connection</h2>
    <p><span id="pill" class="pill"><span class="dot"></span><span id="pillText"></span></span></p>
    <p id="errorText" class="error hidden"></p>
    <div class="actions">
      <button id="btnConnect" class="primary" data-i18n="btnConnect">Connect</button>
      <button id="btnForget" data-i18n="btnForget">Disconnect this browser</button>
    </div>
  </section>

  <section class="card">
    <dl>
      <dt data-i18n="optionsVersion">Extension version</dt><dd id="extVersion"></dd>
      <dt data-i18n="optionsApp">FastDM app</dt><dd id="appVersion">—</dd>
    </dl>
    <p class="muted small" data-i18n="optionsPrivacy"></p>
  </section>

  <script type="module" src="options.js"></script>
</body>
</html>
