name: CI

# Runs on every push and pull request to master and test, and can be started by hand
# (GitHub -> Actions -> CI -> Run workflow).
on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app (build and tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the desktop app
        run: dotnet build FastDM/FastDM.csproj -c Release -p:Platform=x64

      - name: Run bridge and protocol tests
        run: dotnet run --project FastDM.Tests -c Release

  extension:
    name: Browser extension (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run extension tests
        working-directory: FastDM.Extension
        run: npm test
